# 阿里云配置
aliyun:
  accessKeyId: your-access-key-id
  accessKeySecret: your-access-key-secret
  signName: your-sign-name
  templateCode: your-template-code
  endpoint: dysmsapi.aliyuncs.com

# 数据源配置
spring:
  # 邮件配置
  mail:
    host: smtp.example.com
    port: 465
    username: admin@example.com
    password: password
    protocol: smtp
    default-encoding: UTF-8
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3307/hcp_cloud_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: password
          driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis 配置
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 10000ms

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hcp.system.entity
  configuration:
    map-underscore-to-camel-case: true

# 多租户配置 - 只对业务表启用多租户，系统表忽略
hcp:
  tenant:
    column: tenant_id
    ignore-tables:
      # 系统基础表不需要租户隔离
      - sys_config
      - sys_dict_data
      - sys_dict_type
      - sys_logininfor
      - sys_oper_log
      - sys_menu
      - sys_dept
      - sys_role
      - sys_post
      - sys_notice
      - sys_demo
      - sys_oss_config
      - sys_tenant
      - sys_tenant_package
      - gen_table
      - gen_table_column
      - c_file
      - xxl_job_group
      - xxl_job_info
      - xxl_job_lock
      - xxl_job_log
      - xxl_job_log_report
      - xxl_job_logglue
      - xxl_job_registry
      - xxl_job_user

# 日志配置
logging:
  level:
    com.hcp.system.mapper: debug
